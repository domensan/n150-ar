<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f5f3" />
    <meta name="description" content="Explore Fast Fill Systems products in 3D and augmented reality." />
    <title>Product AR</title>

    <script
      type="module"
      src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"
    ></script>

    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <main>
      <section class="launcher" aria-labelledby="title">
        <p id="category" class="category"></p>
        <h1 id="title">Product AR</h1>
        <p class="instruction">Explore the model in 3D or place it at full scale on a horizontal surface.</p>

        <div id="product-picker" hidden>
          <label for="product">Select a model</label>
          <select id="product"></select>
        </div>
        <model-viewer
          id="ar-launcher"
          camera-controls
          touch-action="pan-y"
          loading="eager"
          ar
          ar-modes="webxr scene-viewer quick-look"
          ar-placement="floor"
          ar-scale="fixed"
          shadow-intensity="1"
          xr-environment
        ><span slot="ar-button"></span></model-viewer>

        <button id="launch-ar" class="ar-button" type="button" disabled>
          Preparing AR…
        </button>

        <p id="fallback" class="fallback" role="status" hidden>
          Augmented reality is not supported on this device. Open this page in Safari on a
          compatible iPhone or Chrome on an ARCore-compatible Android phone.
        </p>
      </section>
    </main>

    <script src="./app.js" defer></script>
  </body>
</html>
